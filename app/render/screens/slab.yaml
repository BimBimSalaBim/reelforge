# Screen layouts for the Slab template.
#
# Same slot `kind` names as default.yaml on purpose -- `pick()` and `_resolve()`
# are shared, so this file changes arrangement and nothing else.
#
# Two rules this catalogue exists to keep:
#
# 1. AT MOST ONE SUPPORTING BLOCK per screen. Slab's whole argument is that a
#    frame carries less; a layout stacking three slots would produce a worse
#    frame than the same content split over two screens.
# 2. Slab draws NO eyebrow, so the headline is the screen's only voice -- which
#    means body layouts must not all pull the same headline source, or the reel
#    shows one phrase four times. (It did, on the first attempt.) Most body
#    layouts here therefore lead with content and carry no headline at all,
#    exactly as the Bloom catalogue does with its eyebrows.
#
# Geometry is Slab's grid: x 96-984 (932 below y 1000), headline from y 400,
# support block from y 880. No captions, so the usable band runs to 1500.

# ------------------------------------------------------------------ openers
- id: slab-hook
  role: opener
  weight: 100
  eyebrow: ""
  needs: [hook_lines]
  slots:
    - {kind: headline, y: 400, size: 112, source: hook_lines}

- id: slab-hook-figure
  role: opener
  weight: 70
  eyebrow: ""
  needs: [hook_lines, stats>=1]
  slots:
    - {kind: headline, y: 380, size: 96, source: hook_lines}
    - {kind: counter, y: 1000, size: 168, source: stats}

# -------------------------------------------------------------------- body
# The captured repo page, panned top to bottom under the narration. Weighted
# above everything else in the body so the picker -- which fills the middle in
# weight order -- puts it at index 1, immediately after the opener. That is the
# "after the initial screen, five to ten seconds in" placement.
- id: slab-scroll
  eyebrow: ""
  weight: 99
  needs: [scroll]
  slots:
    # pan rate in frame-pixels/second; 400 reads as a page going by,
    # 1600 (which is what fitting a whole README into one scene gives) is a blur
    - {kind: scroll, source: scroll, speed: 400}

# A screenshot is the one thing on screen the pipeline did not draw, so it is
# worth the most when one exists -- and repeats with a variant so three uploads
# become three screens.
- id: slab-image
  eyebrow: ""
  weight: 96
  needs: [images>=1]
  repeat_with: images
  slots:
    - {kind: image, y: 520, source: images}

# Content-led: no headline, so nothing can repeat.
- id: slab-figure
  eyebrow: ""
  weight: 88
  needs: [stats>=1]
  repeat_with: stats
  slots:
    - {kind: counter, y: 620, size: 210, source: stats}

- id: slab-stats
  eyebrow: ""
  weight: 84
  needs: [stats>=2]
  slots:
    - {kind: statcards, y: 700, source: stats}

- id: slab-command
  eyebrow: ""
  weight: 80
  needs: [commands]
  slots:
    - {kind: terminal, y: 760, source: commands}

- id: slab-quote
  eyebrow: ""
  weight: 74
  needs: [quote]
  slots:
    - {kind: quote, y: 700, source: quote}

- id: slab-facts
  eyebrow: ""
  weight: 68
  needs: [facts>=3]
  repeat_with: facts
  slots:
    - {kind: factlist, y: 640, rows: 4, source: facts}

# The only body layouts with a headline, and they take it from DIFFERENT
# sources so the two cannot say the same thing.
- id: slab-point-facts
  eyebrow: ""
  weight: 58
  needs: [points>=1, facts>=2]
  slots:
    - {kind: headline, y: 400, size: 108, source: point_lines}
    - {kind: factlist, y: 900, rows: 3, source: facts}

- id: slab-tagline-tiles
  eyebrow: ""
  weight: 46
  needs: [tagline, facts>=3]
  slots:
    - {kind: quote, y: 400, source: tagline}
    - {kind: tiles, y: 940, rows: 3, source: facts}

# ------------------------------------------------------------------- closer
- id: slab-end
  role: closer
  weight: 100
  eyebrow: ""
  slots:
    - {kind: endcard}
